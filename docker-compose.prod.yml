# Production stack for system.shehita.co.tz
#
# Usage on the VPS:
#   1. Copy .env.example to .env and fill in strong secrets (see that file).
#   2. docker compose -f docker-compose.prod.yml up -d --build
#
# Key differences from the local docker-compose.yml:
#   - The web port is bound to 127.0.0.1 only, so ONLY Nginx (on the host)
#     can reach it. The container is never exposed directly to the internet.
#   - The MySQL port is NOT published at all — the database is reachable only
#     from inside this compose network.
#   - All secrets come from the .env file, nothing is hard-coded.
#   - restart: unless-stopped keeps the app running across reboots/crashes.
#
# MULTI-TENANT NOTE
# There is no single application database any more. Each client company gets
# its own (shems_<slug>), created by signup.php, alongside one control database
# holding the list of companies, their subscriptions and payments. That is why
# the app connects as root: provisioning a new company needs CREATE DATABASE.

services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # Host port comes from WEB_PORT in .env, defaulting to 8080 when it is not
      # set — so production needs no .env change at all, while a second copy of
      # this stack (a staging deployment) can sit beside it on another port by
      # setting WEB_PORT=8081. Only one program on the host can hold a port, so
      # two stacks sharing 8080 would refuse to start with "port is already
      # allocated". Whatever this resolves to must match proxy_pass in the
      # matching Nginx vhost.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./uploads:/var/www/html/uploads   # persist uploaded logos/files
      # IMPORTANT: keeps the vendor/ directory that was installed during the
      # image build visible. The bind mount above replaces /var/www/html
      # wholesale, which would otherwise hide vendor/ and break the AI
      # assistant at runtime with no error at build time.
      - /var/www/html/vendor
    environment:
      APP_ENV: production
      APP_BASE_URL: ${APP_BASE_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Dar_es_Salaam}

      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CONTROL_DB_NAME: ${CONTROL_DB_NAME:-shehita_control}

      TRIAL_DAYS: ${TRIAL_DAYS:-14}

      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      BILLING_ADMIN_EMAILS: ${BILLING_ADMIN_EMAILS}

      MAIL_DRIVER: ${MAIL_DRIVER:-resend}
      MAIL_FROM: ${MAIL_FROM}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-tls}

      CRON_KEY: ${CRON_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    # No MYSQL_DATABASE: the app creates the control database and one database
    # per client company itself.
    # No host port published — the DB is private to this compose network.
    volumes:
      - dbdata:/var/lib/mysql
      - ./backups:/backups        # mysqldump target, see cron/backup.sh
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
