# Nginx vhost keeping ARC's original hostname working after ARC was migrated
# into the multi-tenant SHEHITA system as the tenant "arc".
#
# WHY THIS EXISTS
# ARC used to be a separate copy of the whole codebase on its own subdomain.
# It is now just another company inside system.shehita.co.tz, reachable at
# /arc/. Everyone at ARC has arc-system.shehita.co.tz bookmarked, so rather
# than breaking those links, this vhost rewrites the hostname onto the tenant
# path before proxying to the same container.
#
#   arc-system.shehita.co.tz/login.php  ->  <container>/arc/login.php
#
# Install on the VPS:
#   sudo cp deploy/nginx/arc-system.shehita.co.tz.conf \
#           /etc/nginx/sites-available/arc-system.shehita.co.tz
#   sudo ln -s /etc/nginx/sites-available/arc-system.shehita.co.tz /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d arc-system.shehita.co.tz
#
# The old ARC container (host port 8090) can be stopped once this is serving.

server {
    listen 80;
    listen [::]:80;
    server_name arc-system.shehita.co.tz;

    client_max_body_size 25M;

    location / {
        # Everything on this hostname belongs to the "arc" company.
        rewrite ^/(.*)$ /arc/$1 break;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }
}
