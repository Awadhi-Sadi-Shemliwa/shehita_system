name: Deploy to Contabo

# Manual-only until the server and secrets are ready.
#
# Deliberately still manual: the multi-tenant rebuild changes the database
# layout (one database per client company) and adds required environment
# variables. Turning on push-to-deploy before .env on the VPS has the new
# values would deploy an app that cannot start.
#
# To enable automatic deploys once the server is set up per DEPLOY.md:
# uncomment the "push:" block below.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "Pulling latest code..."
            git fetch --all
            git reset --hard origin/main
            echo "Rebuilding containers..."
            docker compose -f docker-compose.prod.yml up -d --build
            echo "Cleaning up old images..."
            docker image prune -f
            echo "Deploy complete."
